<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Web前端技术推荐墙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 25px;
            text-align: center;
        }
        #searchInput {
            width: 100%;
            max-width: 420px;
            padding: 12px 18px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid #dcdfe6;
            border-radius: 24px;
            outline: none;
            transition: all 0.3s ease;
        }
        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            padding: 40px 0;
        }
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tech-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tech-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .tech-card .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .tech-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        .tech-card .desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }
        .tech-card .level {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
            background: #667eea;
            margin-bottom: 10px;
        }
        .tech-card .users {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>🚀 Web前端技术推荐墙</h1>
    <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索技术">
    </div>
    <div class="tech-grid" id="techGrid"></div>
    
    <script>
        //TODO1：从这里开始，你的主场！数据数组：给出第1个作为示例，请补全其余9个
//字段说明：
// icon - 技术图标（emoji）
// name - 技术名称
// desc - 一句话描述
// level - 难度（入门/进阶/高级）
// users - 学习人数
        
        const technologies = [
            { icon: "🌐", name: "HTML5", desc: "网页的骨架", level: "入门", users: 100000 },
            { icon: "🎨", name: "CSS3", desc: "网页的外衣", level: "入门", users: 90000},
            { icon: "⚡", name: "JavaScript", desc: "网页的灵魂", level: "入门", users: 85000},
            { icon: "💚", name: "Vue.js", desc: "渐进式框架", level: "进阶", users: 60000},
            { icon: "⚛️", name: "React", desc: "组件化UI库", level: "进阶", users: 70000},
            { icon: "🔷", name: "Node.js", desc: "JS后端运行时", level: "进阶", users: 55000},
            { icon: "📦", name: "TypeScript", desc: "带类型的JS", level: "进阶", users: 65000},
            { icon: "⚡", name: "Webpack", desc: "模块打包工具", level: "进阶", users: 75000},
            { icon: "▲ ", name: "Vite", desc: "极速构建工具", level: "高级", users: 95000},
            { icon: "⚛️", name: "Next.js", desc: "React全栈框架", level: "高级", users: 38000}
        ];

        // ============================================
        // 接下来，看你的：用 map + 模板字符串 + innerHTML
        // 把这10个技术渲染成卡片，塞进 #techGrid 里
        // ============================================

        // TODO 2：用 map + 模板字符串生成卡片HTML字符串
        
        // TODO 3：用 .join('') 拼接成完整字符串

        // TODO 4：用 document.getElementById('techGrid').innerHTML 塞进页面
        const grid = document.getElementById('techGrid');
        const searchInput = document.getElementById('searchInput');

        function render(list) {
            if (list.length === 0) {
                grid.innerHTML = '<p class="empty-tip">没有找到相关技术，换个关键词试试～</p>';
                return;
            }
            const newtechnologies = list.map(t=>`
                <div class="tech-card">
                    <div class="icon">${t.icon}</div>
                    <h3>${t.name}</h3>
                    <p class="desc">${t.desc}</p>
                    <span class="level">${t.level}</span>
                    <p class="users">${t.users.toLocaleString()} 人在学</p>
                </div>    
            `).join('')
            grid.innerHTML = newtechnologies
        }
        render(technologies);

        searchInput.addEventListener('input', function () {
            const keyword = this.value.trim().toLowerCase();
            const filtered = technologies.filter(t => {
                return t.name.toLowerCase().includes(keyword)
                    || t.desc.toLowerCase().includes(keyword)
                    || t.level.toLowerCase().includes(keyword);
            });
            render(filtered);
        });
    </script>
</body>
</html>
